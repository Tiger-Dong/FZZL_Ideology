<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>FZZL · 空无</title>
<style>
:root {
  color-scheme:dark;
  --bg:#030405;
  --panel:#090c10;
  --panel2:#0d1218;
  --line:#1c252d;
  --text:#e9eef3;
  --muted:#76838e;
  --glow:#d5eee8;
  --accent:#a8d9cf;
  font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif
}
* {
  box-sizing:border-box
}
body {
  margin:0;
  background:var(--bg);
  color:var(--text);
  min-height:100vh
}
button {
  font:inherit;
  color:inherit
}
[hidden] {
  display:none!important
}
.app {
  min-height:100vh;
  display:grid;
  grid-template-columns:minmax(0,1fr) 320px;
  max-width:1500px;
  margin:auto
}
.world {
  min-height:100vh;
  background:#000;
  position:relative;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  border-right:1px solid #111
}
.world:before {
  content:"";
  position:absolute;
  width:min(52vw,560px);
  height:min(52vw,560px);
  border-radius:50%;
  border:1px solid #cde9e508;
  box-shadow:inset 0 0 120px #bbffef05;
  opacity:0;
  transition:opacity 1.8s
}
.world.awake:before {
  opacity:1
}
.topline {
  position:absolute;
  top:19px;
  left:16px;
  right:28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  color:#5c6871;
  font-size:11px;
  letter-spacing:.17em;
  text-transform:uppercase
}
.cycle {
  border:1px solid #1b252b;
  border-radius:99px;
  padding:7px 11px;
  letter-spacing:.08em
}
.scene-copy {
  z-index:1;
  min-height:118px;
  text-align:center;
  padding:16px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center
}
.caption {
  font-size:10px;
  color:#71817e;
  letter-spacing:.24em;
  text-transform:uppercase;
  margin-bottom:16px
}
.story {
  font-family:ui-serif,"Songti SC",serif;
  font-weight:300;
  font-size:clamp(22px,3vw,34px);
  line-height:1.5;
  max-width:660px;
  min-height:1.5em
}
.hint {
  color:#66706f;
  font-size:12px;
  margin-top:10px
}
.main-action {
  z-index:2;
  width:148px;
  height:148px;
  border-radius:50%;
  border:1px solid #b4e7dc22;
  background:radial-gradient(circle,#b9eee70c,transparent 68%);
  color:#e5f3ef;
  cursor:pointer;
  display:grid;
  place-items:center;
  transition:.45s;
  box-shadow:0 0 0 0 #a8e3d300;
  animation:breathe 4s ease-in-out infinite
}
.main-action:hover {
  border-color:#bdece477;
  box-shadow:0 0 50px #9fe8db12;
  transform:scale(1.035)
}
.main-action:focus-visible {
  outline:1px solid var(--accent);
  outline-offset:8px
}
.main-action.blank {
  font-size:0
}
.main-action.glyph {
  font-family:serif;
  font-size:28px;
  letter-spacing:4px;
  color:#c3dfd9
}
.main-action.words {
  width:auto;
  min-width:220px;
  height:auto;
  min-height:58px;
  padding:16px 24px;
  border-radius:999px;
  font-family:inherit;
  font-size:14px;
  letter-spacing:.04em;
  animation:none;
  background:#0b1214;
  border-color:#42625c
}
.main-action.thought {
  width:auto;
  height:auto;
  min-width:200px;
  min-height:52px;
  padding:14px 20px;
  border-radius:12px;
  font-size:14px;
  animation:none;
  background:#111a1b;
  border-color:#3c625c
}
.empty-prompt {
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  cursor:crosshair;
  color:transparent;
  z-index:0
}
.world.has-action .empty-prompt {
  display:none
}
.world.awake .scene-copy {
  transform:translateY(-28px)
}
.world.awake .main-action {
  margin-top:4px
}
.ripple {
  position:absolute;
  width:12px;
  height:12px;
  border:1px solid #c6fff133;
  border-radius:50%;
  pointer-events:none;
  animation:ripple 1.4s ease-out forwards
}
@keyframes ripple {
  to {
    transform:scale(35);
    opacity:0
  }
}
@keyframes breathe {
  50% {
    box-shadow:0 0 44px #a8e3d30b;
    border-color:#b4e7dc35
  }
}
.left-actions {
  position:absolute;
  bottom:22px;
  left:24px;
  right:24px;
  z-index:3;
  display:flex;
  justify-content:center;
  gap:9px;
  flex-wrap:wrap
}
.tool-btn,.choice {
  border:1px solid #202d31;
  background:#0b1113;
  color:#bdcbc8;
  border-radius:10px;
  padding:9px 12px;
  font-size:11px;
  cursor:pointer
}
.tool-btn:hover:not(:disabled),.choice:hover {
  border-color:#66877e;
  color:#effbf7
}
.tool-btn:disabled {
  opacity:.35;
  cursor:not-allowed
}
.choices {
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  z-index:7
}
.choice-backdrop {
  position:absolute;
  inset:0;
  background:#000b;
  display:grid;
  place-items:center;
  padding:20px
}
.choice-dialog {
  width:min(520px,100%);
  padding:24px;
  border:1px solid #304440;
  border-radius:16px;
  background:#0a1012;
  box-shadow:0 24px 90px #000c;
  text-align:center
}
.choice-dialog h2 {
  margin:0 0 8px;
  font-size:18px;
  font-weight:500
}
.choice-dialog p {
  margin:0 0 18px;
  color:#869590;
  font-size:12px;
  line-height:1.6
}
.species-grid {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:9px
}
.choice {
  min-height:90px;
  line-height:1.5
}
.choice strong {
  display:block;
  font-size:14px;
  color:#e5efeb
}
.choice span {
  display:block;
  margin-top:6px;
  font-size:10px;
  color:#84918c
}
.cycle-notice {
  position:absolute;
  top:76px;
  left:50%;
  transform:translateX(-50%);
  z-index:2;
  color:#91aaa3;
  font-size:11px;
  letter-spacing:.12em;
  white-space:nowrap
}
.upgrade-notice {
  color:#8caaa2;
  font-size:9px;
  line-height:1.5;
  margin:0 0 8px
}
.worldview-data {
  border-color:#466b62;
  box-shadow:0 0 22px #76cdb41a;
  background:#0a1112
}
.worldview-data-head {
  padding:9px 10px 0;
  color:#b9d8ce;
  font-size:13px;
  font-weight:500;
  letter-spacing:.06em
}
.worldview-data-head .worldview-name {
  font-size:1em;
}
.worldview-data-body {
  padding:4px 10px 8px 24px
}
.worldview-data-scale {
  font-size:10px;
  color:#9aafa8;
  margin-top:2px
}
.worldview-data-race {
  display:flex;
  flex-wrap:wrap;
  column-gap:24px;
  row-gap:4px;
  font-size:10px;
  color:#d1ded8;
  margin-top:4px
}
.worldview-branches-label {
  font-size:9px;
  color:#72817d;
  margin:5px 0 3px
}
.worldview-branches {
  display:flex;
  gap:6px;
  flex-wrap:wrap
}
.worldview-branches span {
  padding:4px 7px;
  border:1px solid #29433d;
  border-radius:99px;
  color:#b7d5cc;
  font-size:9px
}
.resource-category {
  margin-bottom:10px
}
.resource-category:last-child {
  margin-bottom:0
}
.resource-category h3 {
  margin:6px 0 2px;
  padding:5px 2px;
  color:#82918c;
  font-size:9px;
  font-weight:500;
  letter-spacing:.1em;
  border-bottom:1px solid #172025
}
.res-row:disabled {
  cursor:default;
  opacity:.43
}
.worldview-card {
  display:flex;
  flex-direction:column;
  gap:6px;
  padding:12px;
  border:1px solid #2c423e;
  border-radius:10px;
  background:#0d1717;
  margin-bottom:8px
}
.worldview-card span,.worldview-card small {
  font-size:9px;
  color:#7f918b
}
.worldview-card strong {
  font-size:14px;
  color:#dcebe5;
  font-weight:500
}
.res-row.subordinate {
  opacity:.52
}
.upgrade-category {
  border-top:1px solid #1b292b;
  padding-top:9px;
  margin-top:9px
}
.upgrade-category:first-child {
  border-top:0;
  padding-top:0;
  margin-top:0
}
.upgrade-category h3 {
  margin:0 0 7px;
  color:#9eafaa;
  font-size:10px;
  font-weight:500;
  letter-spacing:.08em
}
.upgrade-panel .upgrade-list {
  display:grid;
  grid-template-columns:1fr;
  gap:7px
}
.aside {
  background:#080b0e;
  padding:23px 17px;
  display:flex;
  flex-direction:column;
  gap:10px;
  overflow:auto;
  max-height:100vh;
  position:sticky;
  top:0;
  border-left:1px solid #111
}
.aside-head {
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:3px 2px 13px;
  border-bottom:1px solid var(--line)
}
.aside-head strong {
  font-size:12px;
  letter-spacing:.16em;
  font-weight:500;
  color:#9caaa8;
  text-shadow:0 0 8px rgba(168, 217, 207, 0.25)
}
.reset {
  border:0;
  background:none;
  color:#69757d;
  font-size:10px;
  cursor:pointer
}
.group {
  border:1px solid #1c262c;
  border-radius:11px;
  background:#090d11;
  overflow:hidden
}
.group summary {
  list-style:none;
  padding:12px 13px;
  cursor:pointer;
  color:#acbbb8;
  font-size:11px;
  letter-spacing:.07em;
  display:flex;
  justify-content:space-between;
  align-items:center
}
.group summary::-webkit-details-marker {
  display:none
}
.group summary:after {
  content:"＋";
  color:#66746f;
  font-size:12px
}
.group[open] summary:after {
  content:"−"
}
.group-body {
  padding:0 12px 12px
}
.res-row {
  display:grid;
  grid-template-columns:1fr auto;
  align-items:center;
  width:100%;
  text-align:left;
  padding:9px 2px;
  border:0;
  border-top:1px solid #172025;
  background:none;
  cursor:pointer
}
.res-name {
  font-size:11px;
  color:#c4cfcc
}
.res-value {
  font-size:13px;
  color:#edf5f1;
  font-variant-numeric:tabular-nums
}
.res-sub {
  grid-column:1/-1;
  font-size:9px;
  color:#63716e;
  margin-top:4px;
  line-height:1.5;
  display:none
}
.res-row.selected .res-sub {
  display:block
}
.locked {
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:9px 2px;
  border-top:1px solid #172025;
  color:#606c6a;
  font-size:10px
}
.locked b {
  font-weight:400;
  color:#76827e
}
.side-note {
  font-size:12px;
  line-height:1.6;
  color:#b4c8c1;
  margin-top:auto;
  padding:8px 3px
}
.toast {
  position:fixed;
  bottom:18px;
  left:calc((100vw - 320px)/2);
  transform:translateX(-50%);
  padding:10px 14px;
  border:1px solid #344c47;
  border-radius:10px;
  background:#111b1b;
  color:#d8ece5;
  font-size:11px;
  z-index:8;
  opacity:0;
  pointer-events:none;
  transition:.2s
}
.toast.show {
  opacity:1
}
.mobile-title {
  display:none
}
@media(max-width:760px) {
  .app {
    display:flex;
    flex-direction:column
  }
  .world {
    min-height:70vh;
    min-height:70svh;
    border-right:0;
    border-bottom:1px solid #172022
  }
  .topline {
    top:10px;
    left:10px;
    right:15px
  }
  .world:before {
    width:min(72vw,430px);
    height:min(72vw,430px)
  }
  .aside {
    position:relative;
    max-height:none;
    border-left:0;
    padding:14px;
    display:grid;
    grid-template-columns:1fr 1fr;
    align-content:start
  }
  .aside-head,.side-note {
    grid-column:1/-1
  }
  .aside-head {
    padding-bottom:8px
  }
  .left-actions {
    bottom:13px
  }
  .choices {
    bottom:55px
  }
  .main-action {
    width:120px;
    height:120px
  }
  .toast {
    left:50%
  }
}
@media(max-width:460px) {
  .aside {
    grid-template-columns:1fr
  }
  .aside-head,.side-note {
    grid-column:auto
  }
  .world {
    min-height:66vh;
    min-height:66svh
  }
  .scene-copy {
    min-height:105px
  }
  .story {
    font-size:23px
  }
  .left-actions {
    left:10px;
    right:10px
  }
  .main-action {
    width:108px;
    height:108px
  }
}
/* 资源表：库存、容量与自动节奏并列，保留窄屏可读性。 */
.resource-toolbar {
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:8px;
  padding:1px 0 8px;
  color:#788b85;
  font-size:10px
}
.resource-settings-toggle {
  border:1px solid #283a38;
  border-radius:6px;
  background:#10191a;
  color:#b8d2ca;
  padding:5px 8px;
  cursor:pointer
}
.resource-settings {
  padding:8px;
  margin-bottom:8px;
  border:1px solid #263a37;
  border-radius:8px;
  background:#0c1515
}
.resource-settings p {
  margin:0 0 7px;
  color:#91a59e;
  font-size:10px
}
.resource-options {
  display:flex;
  flex-wrap:wrap;
  gap:7px 12px
}
.resource-options label {
  display:flex;
  align-items:center;
  gap:4px;
  color:#b8cac4;
  font-size:11px;
  cursor:pointer
}
.resource-options input {
  accent-color:#87bfb0
}
.resource-table-head,.resource-table .res-row {
  display:grid;
  grid-template-columns:minmax(56px,1fr) minmax(62px,auto) minmax(76px,auto);
  gap:5px;
  align-items:center
}
.resource-table-head {
  padding:3px 2px 5px;
  color:#667a73;
  font-size:9px;
  text-align:right
}
.resource-table-head span:first-child {
  text-align:left
}
.resource-table .res-row {
  padding:8px 2px
}
.resource-table .res-value {
  font-size:11px;
  text-align:right;
  white-space:nowrap
}
.resource-table .res-cap {
  color:#74847f
}
.resource-rate {
  font-size:10px;
  text-align:right;
  white-space:nowrap;
  color:#a8c9bc;
  font-variant-numeric:tabular-nums
}
.resource-rate.paused {
  color:#77827f
}
.resource-table .res-sub {
  grid-column:1/-1;
  text-align:left
}
.resource-empty {
  font-size:10px;
  color:#788983;
  padding:8px 2px
}
.resource-table .res-row:focus-visible,.resource-settings-toggle:focus-visible {
  outline:2px solid #a8d9cf;
  outline-offset:2px
}
</style>
<style>
.upgrade-panel {
  position:absolute;
  left:18px;
  right:18px;
  bottom:16px;
  z-index:4;
  padding:8px 14px 10px;
  border:1px solid transparent;
  border-radius:0;
  background:rgba(7,11,14,.55);
  box-shadow:none;
  backdrop-filter:blur(10px);
  max-height:190px;
  overflow:auto
}
.left-progress {
  display:contents;
}
@media (max-width:1000px) {
  .left-progress > .worldview-data {
    position:absolute;
    z-index:4;
    top:44px;
    left:10px;
    width:min(260px, calc(100% - 20px));
  }
}
.upgrade-panel[hidden] {
  display:none
}
.upgrade-head {
  display:flex;
  align-items:center;
  gap:16px;
  margin-bottom:6px
}
.upgrade-head strong {
  font-size:10px;
  letter-spacing:.12em;
  text-transform:uppercase;
  color:#a1b2ae;
  font-weight:500;
  white-space:nowrap
}
.upgrade-head nav {
  display:flex;
  gap:5px;
  flex-wrap:wrap;
  flex-direction:column;
  width:100%
}
.upgrade-tab {
  border:1px solid transparent;
  background:transparent;
  color:#697873;
  border-radius:7px;
  padding:5px 9px;
  font-size:10px;
  cursor:pointer
}
.upgrade-tab.active {
  color:#d9f0e9;
  border-color:#35534e;
  background:#12201e
}
.upgrade-tab:disabled {
  opacity:.42;
  cursor:not-allowed
}
.upgrade-list {
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:5px
}
.upgrade-panel .upgrade-list {
  grid-template-columns:1fr
}
.upgrade-card {
  position:relative;
  display:grid;
  grid-template-columns:minmax(0,1fr) auto;
  gap:8px;
  align-items:center;
  border:1px solid #1e2c30;
  background:#0b1114;
  border-radius:10px;
  padding:9px 10px
}
.upgrade-card strong {
  font-size:11px;
  font-weight:500;
  color:#dce7e2
}
.upgrade-card p {
  font-size:9px;
  line-height:1.45;
  color:#75847f;
  margin:4px 0 0
}
/* 简短描述略小于名称，并保持足够对比度。 */
.upgrade-card > div > strong + p {
  font-size:10px;
  color:#a0b1ab;
}
.upgrade-card button,.upgrade-footer button {
  border:1px solid #3b625b;
  background:#11231f;
  color:#c9eee2;
  border-radius:8px;
  padding:8px 10px;
  font-size:10px;
  white-space:nowrap;
  cursor:pointer
}
.upgrade-card button:disabled,.upgrade-footer button:disabled {
  opacity:.36;
  cursor:not-allowed
}
.upgrade-footer {
  display:flex;
  justify-content:flex-end;
  gap:7px;
  margin-top:8px
}
.upgrade-footer:empty {
  display:none
}
.world.has-upgrades .choices {
  bottom:204px
}
@media(max-width:760px) {
  .world {
    min-height:100svh
  }
  .upgrade-panel {
    left:10px;
    right:10px;
    bottom:10px;
    max-height:210px;
    padding:10px
  }
  .world.has-upgrades .choices {
    bottom:222px
  }
  .upgrade-list {
    grid-template-columns:1fr 1fr;
    gap:5px
  }
  .upgrade-card {
    padding:8px
  }
  .upgrade-card button {
    padding:7px 8px
  }
  .upgrade-head {
    gap:8px;
    flex-wrap:wrap
  }
  .upgrade-footer {
    justify-content:center
  }
}
@media(max-width:460px) {
  .upgrade-list {
    grid-template-columns:1fr
  }
  .upgrade-panel {
    max-height:235px
  }
  .upgrade-card p {
    font-size:9px
  }
  .world.has-upgrades .choices {
    bottom:247px
  }
}
@media(min-width:1001px) {
  .left-progress {
    position:absolute;
    z-index:4;
    left:16px;
    top:56px;
    bottom:16px;
    width:300px;
    display:flex;
    flex-direction:column;
    gap:6px;
    min-height:0;
  }
  .left-progress > .worldview-data { flex:none; }
  .upgrade-panel {
    position:relative;
    inset:auto;
    width:100%;
    flex:1;
    min-height:0;
    max-height:none
  }
  .upgrade-head {
    align-items:flex-start;
    flex-direction:column;
    gap:7px
  }
  .upgrade-head nav {
    flex-direction:row;
    width:100%
  }
  .upgrade-list {
    grid-template-columns:1fr
  }
  .upgrade-footer {
    justify-content:flex-start;
    flex-direction:column
  }
  .world.has-upgrades .choices {
    bottom:18px
  }
}
</style>
<style>
.world {
  --ring-size:min(62vmin,680px)
}
.world:before {
  top:50%;
  left:50%;
  width:var(--ring-size);
  height:var(--ring-size);
  transform:translate(-50%,-50%);
  z-index:0;
  pointer-events:none
}
.world.thought-phase {
  --ring-size:min(96vmin,1040px)
}
.scene-stack {
  position:absolute;
  z-index:2;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);

                                                  '推进当前阶段的特殊成长。';
      const metadata = specialUpgradeMeta(item);
      card.innerHTML = `<div><strong>${item.name}</strong><p>${brief}</p><p class="upgrade-level">${

          metadata.preview}</p>${item.button.includes(metadata.cost) ? '' : `<p class="upgrade-cost">需要：${metadata.cost}</p>`}<small><button type="button" class="encyclopedia-link" data-encyclopedia="${
          encyclopediaId}">详细说明</button></small></div><button type="button" data-special-action ${
          item.disabled ? 'disabled' : ''}>${item.button}</button>`;
      card.querySelector('[data-encyclopedia]').onclick = () => openEncyclopedia(encyclopediaId);
      const button = card.querySelector('[data-special-action]');
      button.onclick = () => {
        if (item.type === 'story-event') {
          s.storyDialogOpen = true;
          render();
          save()
        } else if (item.type === 'species') {
          s.choiceDialogOpen = true;
          render();
          save()
        } else if (item.type === 'branch')
          selectWorldBranch(item.id);
        else if (item.type === 'race-stage')
          chooseRaceStage(item.id);
        else if (item.type === 'cap')
          buyUpgradeCap(item.id);
        else if (item.type === 'life-sprout')
          unlockLifeSprout();
        else if (item.type === 'unlock-spirit') {
          s.thoughts -= 200;
          s.spiritLanguageUnlocked = true;
          markSpecial('解锁 · 灵与身');
          logEvent('投入 200 个念头，解锁灵与身。');
          render();
          save();
          toast('灵与身已解锁。')
        } else
          buyStageChoice(item.id)
      };
      list.append(card)
    });
    const completed =
        s.mode === 'summary' ? stageChoices().filter(x => x.owned).map(x => ({label: x.name})) : [];
    if (s.mode !== 'summary') return;
    const doneTitle = document.createElement('h3');
    doneTitle.className = 'completed-title';
    doneTitle.textContent = `已完成 · ${completed.length}`;
    list.append(doneTitle);
    if (!completed.length) {
      const empty = document.createElement('div');
      empty.className = 'special-empty';
      empty.textContent =
          s.mode === 'summary' ? '已完成的回响遗产会收录在这里。' : '完成的特殊升级与阶段进阶会收录在这里。';
      list.append(empty)
    } else
      [...completed].reverse().forEach(item => {
        const done = document.createElement('div');
        done.className = 'completed-card';
        done.innerHTML = `<strong>✓ ${item.cycle ? `第 ${String(item.cycle).padStart(2, '0')} 轮 · ` : ''}${
            item.label}</strong>`;
        list.append(done)
      });
  }
  // 升级面板入口。只构建玩家当前打开的分类。
  function renderUpgrades() {
    const panel = $('upgradePanel'), tabs = $('upgradeTabs'), list = $('upgradeList'),
          footer = $('upgradeFooter');

    panel.hidden = !active;
    world.classList.toggle('has-upgrades', active);
    tabs.innerHTML = '';
    list.innerHTML = '';
    footer.innerHTML = '';
    if (!active) return;
    if (s.mode === 'summary')
      s.upgradeTab = 'legacy';

      s.upgradeTab = 'explore';
    $('upgradeTitle').textContent = s.mode === 'summary' ? '回响恒铸' : '成长与探索';
    const categories = [
      {id: 'thought', label: '思维', locked: s.mode === 'summary'},
      {id: 'species', label: '载体', locked: !s.species || s.mode === 'summary'},
      {id: 'explore', label: '发展探索', locked: s.mode === 'summary'},
      {id: 'trial', label: '灾变应对', locked: !s.species || s.mode === 'summary'},

                const unit = race ? raceResourceName(currency) : '念头';

                      [intro, effect] = upgradeCardCopy(id, desc);

                    id}">详细说明</button></small></div><button type="button" data-up="${id}" ${

    };
    if (s.upgradeTab === 'legacy' || s.upgradeTab === 'explore') {

        if (directions.length) {
          addCards(directions.map(x => ({id: x.id, name: x.name, desc: x.description})), true)
        }

        }
      }
    } else if (s.upgradeTab === 'thought') {

      return;
    } else if (s.upgradeTab === 'trial') {

        notice.className = 'upgrade-notice';
        notice.textContent = '本轮考验已结束，可以继续成长或结束本轮。';
        list.append(notice)
      }
    } else if (s.upgradeTab === 'species') {

      raceBaseHeading.className = 'upgrade-category';
      raceBaseHeading.innerHTML = '<h3>基础提升 · 资源容量</h3>';
      list.append(raceBaseHeading);
      const warehouse = document.createElement('article');
      warehouse.className = 'upgrade-card';
      const warehouseCost = storageCost('race'), baseCurrency = worlds[s.worldview].currency;
      warehouse.innerHTML =
          `<div><strong>载体仓库 · 承载强化</strong><p>扩大载体资源的承载空间。</p><p class="upgrade-level">Lv.${
              s.storage.race || 0}</p><p class="upgrade-preview">基础容量 ${raceCapacity(baseCurrency)} → ${
              raceCapacity(baseCurrency) + 2000}</p></div><button type="button" ${
              (s.raceResources[baseCurrency] || 0) < warehouseCost || storageRequirement('race') ?
                  'disabled' :
                  ''}>扩容 · ${warehouseCost} ${raceResourceName(baseCurrency)}</button>`;
      warehouse.querySelector('button').onclick = () => buyStorage('race');
      if (revealUpgrade('race-storage', !storageRequirement('race') || s.storage.race > 0))
        list.append(warehouse);
      const defs = speciesUpgradeDefs();

                     })),

      };

          s.species === 'human'      ? '基础提升 · 个体素质' :
              s.species === 'animal' ? '基础提升 · 躯体变化' :
                                       '基础提升 · 自身成长',
          defs.filter(u => u.kind === 'stat'));
      const evolutionTitle = document.createElement('h3');
      evolutionTitle.className = 'completed-title';
      evolutionTitle.textContent = '进阶拓展 · 载体能力';
      list.append(evolutionTitle);
      const evolutionDefs = raceEvolutionDefs[s.species], currency = worlds[s.worldview].currency;
      evolutionDefs.forEach((v, i) => {
        if (i > 0 && !raceEvolutionUnlocked(evolutionDefs[i - 1].id) && !raceEvolutionUnlocked(v.id)) return;
        const done = raceEvolutionUnlocked(v.id),
              prereq = i === 0 || raceEvolutionUnlocked(evolutionDefs[i - 1].id),
              card = document.createElement('article');
        card.className = 'upgrade-card';
        card.innerHTML =
            `<div><strong>${v.name}</strong><p>${v.desc}</p><p class="upgrade-level">能力解锁 · ${
                done ? 1 : 0} / 1</p><p class="upgrade-preview">${
                done ? '已掌握' : `未掌握 → 获得${v.name}`}</p></div><button type="button" ${
                done || !prereq || (s.raceResources[currency] || 0) < raceEvolutionCost(i) ? 'disabled' :
                                                                                             ''}>${
                done ? '已解锁' : `解锁 · ${raceEvolutionCost(i)} ${raceResourceName(currency)}`}</button>`;
        card.querySelector('button').onclick = () => unlockRaceEvolution(v.id);
        list.append(card)
      });
      const route = document.createElement('p');
      route.className = 'upgrade-notice';
      route.textContent = s.worldviewBranch ? speciesRouteDescriptions[s.species][s.worldview] : '继续发展载体，探索当前世界观下的通用能力。';
      list.append(route);
      const trait = document.createElement('p');
      trait.className = 'upgrade-notice';
      trait.textContent = ({
        human: '载体特色：创造实践会强化保存知识的方案。',
        animal: '载体特色：敏捷反应会降低延续族群的资源消耗。',
        plant: '载体特色：扎根成长可增加延续印记的数量。'
      })[s.species];
      list.append(trait);
      const recipeTitle = document.createElement('h3');
      recipeTitle.className = 'completed-title';
      recipeTitle.textContent = '进阶拓展 · 资源转化';
      let recipesShown = false;
      for (const [from, to, cost, tier] of raceRecipes()) {
        const card = document.createElement('article');
        card.className = 'upgrade-card';
        const unlocked = !!s.stageUnlocks.transcendence && s.raceStage >= 1 &&
            raceEvolutionUnlocked(worldEvolutionDefs[s.worldview].id) && raceTier() >= tier;
        if (!revealUpgrade('recipe-' + to, unlocked || (s.raceResources[to] || 0) > 0)) continue;
        if (!recipesShown) {
          list.append(recipeTitle);
          recipesShown = true
        }
        card.innerHTML = `<div><strong>${raceResourceName(to)}</strong><p>消耗 ${cost} ${
            raceResourceName(from)} → 1 ${raceResourceName(to)}。</p><small>${
            unlocked ?
                '转换能力已开放' :
                '需解锁超凡适应、世界观能力，并达到载体第一阶段及对应资源阶位'}</small></div><button type="button" ${
            !unlocked || (s.raceResources[from] || 0) < cost ||
                    (s.raceResources[to] || 0) >= raceCapacity(to) ?
                'disabled' :
                ''}>转化</button>`;
        card.querySelector('button').onclick = () => convertRaceResource(to);
        list.append(card);
        const use = document.createElement('article');
        use.className = 'upgrade-card';
        use.innerHTML = `<div><strong>运用${
            raceResourceName(
                to)}</strong><p>消耗 1 个，用于本轮灾难观察；同一轮观察只需准备一次。</p></div><button type="button" ${
            s.crisisResult || s.crisisPrep.includes('study') || (s.raceResources[to] || 0) < 1 ?
                'disabled' :
                ''}>研究灾难</button>`;
        use.querySelector('button').onclick = () => useAdvancedResource(to);
        list.append(use)
      }
      const tierNote = document.createElement('p');
      tierNote.className = 'upgrade-notice';
      tierNote.textContent = `当前载体阶段 ${s.raceStage}。各项素质每级 +1，达到 10、30、50、80、100 时分别出现阶段特性。`;
      list.append(tierNote);
      renderSpecialSection(
          list, item => item.type === 'cap' && speciesUpgradeDefs().some(x => x.id === item.id));
    }
    if (s.upgradeTab === 'species' && s.mode === 'world') renderPendingTraits(list);
    polishUpgradeCards(list);
    if (s.mode === 'world' && s.species && s.upgradeTab === 'trial') {
      const collapseBtn = document.createElement('button');
      collapseBtn.textContent = s.crisisResult ? '结束本轮' :
          s.trialPlan.started                  ? '立即迎接考验' :
                                                 '请先开始探测';
      collapseBtn.disabled = !s.crisisResult && !s.trialPlan.started;
      collapseBtn.onclick = s.crisisResult ? finishSurvivedCycle : resolveTimedTrial;
      footer.append(collapseBtn)
    }
    if (s.mode === 'summary') {
      const next = document.createElement('button');
      next.textContent = '进入下一轮';
      next.onclick = nextCycle;
      footer.append(next)
    }
  }
  function updateWorldDataView() {
    const select = $('worldDataSelect'), life = !!s.species,
          civil = !!(s.stageUnlocks.civilization && s.cycle >= 3);
    if (!select) return;
    for (const option of select.options) {
      if (option.value === 'life') option.hidden = !life;
      if (option.value === 'civil') option.hidden = !civil
    }
    const allowed =
        ['resource', 'mind', 'story', 'legacy', ...(life ? ['life'] : []), ...(civil ? ['civil'] : [])];
    if (!allowed.includes(s.worldDataView)) s.worldDataView = 'resource';
    select.value = s.worldDataView;
    $('worldDataContent')
        .querySelectorAll('[data-world-view]')
        .forEach(panel => {panel.hidden = panel.dataset.worldView !== s.worldDataView});
  }
  // 资源面板。根据当前阶段显示库存、容量和产出。
  function renderResources() {
    const previousFocus = document.activeElement;
    const focusTarget = previousFocus?.id === 'resourceSettingsToggle' ? 'toggle' :
        previousFocus?.dataset?.resourceVisible ? `visible:${previousFocus.dataset.resourceVisible}` :
        previousFocus?.dataset?.res ? `resource:${previousFocus.dataset.res}` :
                                      '';
    const ideaRow = [
      'ideology', '思想', ideologyCount(),
      s.stageUnlocks.ideology ? '解锁后，消耗 100 个思维网络凝结 1 点思想。' :
                                '轮回结算后可用回响解锁思想阶段。',
      !s.stageUnlocks.ideology
    ];
    let thoughtRows = s.network ?
        [
          ['thought', '念头', whole(s.thoughts), '基础思维资源，可用于升级。'],
          [
            'mind', '知识节点', s.mind,
            `容量 ${
                nodeCapacity()}；解锁思维萌芽后，每 30 秒消耗至少 500 念头合成 1 个；每个使念头自然增长速度提高 0.01%。`
          ],
          ['networkLinks', '思绪链接', s.networkLinks, '消耗 3 个节点转化 1 条链接。'],
          ['networkCount', '思维网络', s.networkCount || 0, '消耗 3 条链接转化 1 个网络。'], ideaRow,
          ['consciousness', '意志', 0, '思想进一步演变后形成，尚未开放。', true],
          ['disturbance', '扰动', s.disturbances, '次级来源：已归类于念头，仍会自动积累并转化。']
        ] :
        [
          [
            'disturbance', '扰动', s.disturbances,
            `自动节奏约每 ${Math.max(1, whole(disturbanceInterval()))} 秒增加 ${
                whole(growthYield())} 个；每 100 个扰动消耗转化为 1 个念头。`
          ],
          [
            'thought', '念头', whole(s.thoughts),
            `基础间隔约 ${Math.max(1, whole(thoughtInterval()))} 秒；每 100 个扰动消耗转化为 1 个念头。`
          ],
          [
            'mind', '知识节点', s.mind,
            `容量 ${
                nodeCapacity()}；解锁思维萌芽后，每 30 秒消耗至少 500 念头合成 1 个；每个使念头自然增长速度提高 0.01%。`
          ],
          ['networkLinks', '思绪链接', s.networkLinks, '消耗 3 个节点转化 1 条链接。'],
          ['networkCount', '思维网络', s.networkCount || 0, '消耗 3 条链接转化 1 个网络。'], ideaRow,
          ['consciousness', '意志', 0, '思想进一步演变后形成，尚未开放。', true]
        ];
    const hidden = s.hiddenResources && typeof s.hiddenResources === 'object' ? s.hiddenResources :
                                                                                (s.hiddenResources = {});
    const running = ['growth', 'species', 'world'].includes(s.mode);
    const intervalText = (seconds, amount) => {
      const ms = Math.max(1, Math.round(seconds * 1000));
      return `约 ${ms % 1000 === 0 ? `${ms / 1000} 秒` : `${ms} 毫秒`} +${whole(amount)}`
    };
    const rateFor = (id, value, locked) => {
      if (locked) return '未解锁';
      if (!running) return '暂停';
      if (id === 'disturbance')
        return value >= 1000 ? '已满' : intervalText(disturbanceInterval(), growthYield());
      if (id === 'thought')
        return value >= thoughtCapacity() ? '已满' : intervalText(thoughtInterval(), thoughtYield());
      if (id === 'mind')
        return !s.mindEvolutions.sprout ? '待解锁合成' :
            value >= nodeCapacity()     ? '已满' :
            s.thoughts < nodeCost()     ? '等待念头' :
                                          '每 30 秒 +1';
      if (s.worldview && id === worlds[s.worldview].currency) {
        if (value >= raceCapacity(id)) return '已满';
        const n = carrierRateThousandths();
        let a = n, b = 1000;
        while (b) {
          const t = a % b;
          a = b;
          b = t
        }
        return `每 ${1000 / a} 秒 +${n / a}`
      }
      return '手动转化';
    };
    const liveCapacityFor = id =>
        ({
          thought: thoughtCapacity(),
          disturbance: 1000,
          mind: nodeCapacity(),
          networkLinks: linkCapacity(),
          networkCount: networkCapacity(),
          ideology: s.ideologyCap
        }[id] ??
         ((s.worldview && worlds[s.worldview].resources.some(r => r[0] === id)) ? raceCapacity(id) : null));
    const capacityFor = id =>
        s.mode === 'summary' && s.summaryResources?.caps && Object.hasOwn(s.summaryResources.caps, id) ?
        s.summaryResources.caps[id] :
        liveCapacityFor(id);
    const rowHtml = ([id, name, value, desc, locked = false]) => {
      const cap = capacityFor(id), rate = rateFor(id, value, locked);
      const explanation = id === 'thought' ? ' 自动产出之外，扰动转化也会增加念头；知识节点合成会消耗念头。' :
          id === 'disturbance'             ? ' 每 100 个扰动可消耗转化为 1 个念头，念头满时暂停转化。' :
          id === 'mind'                    ? ' 每 30 秒仅在念头足够且节点未满时尝试合成。' :
                                             '';
      return `<button type="button" class="res-row ${
          s.network && id === 'disturbance' ? 'subordinate ' :
                                              ''}${s.selectedResource === id ? 'selected' : ''}" data-res="${
          id}" ${locked ? 'disabled' : ''} aria-expanded="${
          s.selectedResource === id}"><span class="res-name">${name}</span><span class="res-value">${
          locked ? '—' :
                   whole(value).toLocaleString() +
                  (cap !== null ? ` <span class="res-cap">/ ${whole(cap).toLocaleString()}</span>` :
                                  '')}</span><span class="resource-rate ${
          locked || rate === '已满' || rate === '暂停' ?
              'paused' :
              ''}">${rate}</span><span class="res-sub">${desc}${explanation}</span></button>`
    };
    let speciesRows = [];
    if (s.species && s.worldview) {
      const w = worlds[s.worldview];
      speciesRows = w.resources.map(
          ([id, name, desc]) =>
              [id, name, s.raceResources[id] || 0,
               id === w.currency ? `${desc} 自动产出包含灵与身及载体成长加成；点击产出另行计算。` :
                                   `${desc} 高阶资源须消耗下级资源转化，无法自动产出。`,
               !raceResourceUnlocked(id)])
    }
    if (s.mode === 'summary') {
      if (!s.summaryResources) {
        const rows = [...thoughtRows, ...speciesRows];
        s.summaryResources = {
          thoughtRows: thoughtRows.map(row => [...row]),
          speciesRows: speciesRows.map(row => [...row]),
          caps: Object.fromEntries(rows.map(row => [row[0], liveCapacityFor(row[0])]))
        }
      }
      thoughtRows = s.summaryResources.thoughtRows;
      speciesRows = s.summaryResources.speciesRows;
    }
    const resourceVisible = row => {
      const [id, , , , locked] = row;
      if (locked) return false;
      const unlocked = id === 'disturbance' ?
          s.mode !== 'void' :
          id === 'thought' ?
          ['growth', 'species', 'world', 'trial', 'aftermath', 'summary'].includes(s.mode) :
          id === 'mind'          ? !!s.mindEvolutions.sprout :
          id === 'networkLinks'  ? !!s.mindEvolutions.knowledge :
          id === 'networkCount'  ? !!s.mindEvolutions.web || s.network :
          id === 'ideology'      ? !!s.stageUnlocks.ideology :
          id === 'consciousness' ? false :
                                   true;
      s.discoveredResources = s.discoveredResources || {};

      };
    if (item.type === 'stage') {
      const d = stageChoices().find(x => x.id === item.id), l = d.level || 0;
      const preview = {
        archive: `开局念头 ${s.archiveLv * 50} → ${(s.archiveLv + 1) * 50}；扰动 ${s.archiveLv * 100} → ${
            (s.archiveLv + 1) * 100}`,
        mindStorage: `永久念头容量加成 ${s.legacyStorage.mind * 5000} → ${(s.legacyStorage.mind + 1) * 5000}`,
        raceStorage: `永久载体容量加成 ${s.legacyStorage.race * 5000} → ${(s.legacyStorage.race + 1) * 5000}`,
        resourceFlow: `基础额外产出 ${l * 5} → ${(l + 1) * 5} / 秒`,
        thoughtSpeed: `思维升级成本减免 ${l * 5}% → ${(l + 1) * 5}%`,
        structure: `载体升级成本减免 ${l * 5}% → ${(l + 1) * 5}%`,
        trialTime: `额外准备时间 ${l * 2} → ${(l + 1) * 2} 分钟`,
        planSlots: `方案数量与等级上限加成 ${l} → ${l + 1}`
      }[item.id] ||
          `未解锁 → ${item.name}`;
      return {
        level: d.level === undefined ? '阶段解锁 · 0 / 1' :
                                       `Lv.${l} / ${Number.isFinite(d.max) ? d.max : '持续扩展'}`,
        preview,
        cost: `${d.cost} 回响`
      };
    }
    return {
      level: item.type === 'story-event' ? `经历 ${s.storyEvent.stage} / 2` : '阶段解锁 · 0 / 1',
      preview: item.type === 'species'  ? '未选择 → 确定本轮生命载体' :
          item.type === 'life-sprout'   ? '点击载体资源 0 → 1 / 次' :
          item.type === 'unlock-spirit' ? '未开放 → 开放联动升级' :
          item.type === 'story-event'   ? '进入下一段载体经历' :
                                          item.desc,
      cost: item.type === 'unlock-spirit' ? '200 念头' : '无资源消耗'
    };
  }
  function cardMeta(id) {
    if (['frequency', 'growth', 'network', 'spirit-language'].includes(id))
      return `Lv.${upgradeLevel(id)} / ${upgradeCap(id)}`;
    if (id === 'spirit-unlock') return '阶段解锁 · 0 / 1';
    if (id.startsWith('trait-')) return '阶段强化 · 0 / 1';
    if (id === 'storage') return `Lv.${s.storage.mind || 0} / 20`;
    if (id.startsWith('cap-')) {
      const kind = id.slice(4);
      return `Lv.${s.capacityLevels[kind] || 0} / ${{node: 20, link: 15, network: 10}[kind]}`
    }
    if (['sprout', 'knowledge', 'thread', 'web'].includes(id))
      return `阶段解锁 · ${s.mindEvolutions[id] ? 1 : 0} / 1`;
    return '';
  }
  function uiCard(list, id, name, intro, preview, button, enabled, click, details = []) {
    const a = document.createElement('article');
    a.className = 'upgrade-card';
    let cost = button.includes(' · ') ? button.split(' · ').slice(1).join(' · ') : '';
    if (id.startsWith('convert-')) cost = preview.split(' → ')[0];
    if (id.startsWith('trait-')) cost = button.split(' · ').slice(1).join(' · ');
    if (['sprout', 'knowledge', 'thread', 'web'].includes(id)) {
      const d = mindEvolutionDef(id);
      cost = `${d.cost} 念头、${d.nodes} 节点、${d.links} 链接`;
      preview = {
        sprout: '节点自动合成：未开放 → 每 30 秒尝试一次',
        knowledge: `节点容量 ${nodeCapacity()} → ${
            Math.max(20, s.migrationCapacity.node) + 5 * (s.capacityLevels.node || 0)}`,
        thread: '每条链接增幅：0.01% → 0.1%',
        web: '网络合成：未开放 → 可手动合成'
      }[id]
    }
    a.innerHTML = `<div><strong><button type="button" class="encyclopedia-link" data-encyclopedia="v16-${id}">${name}</button></strong><p>${intro}</p>${
        cardMeta(id) ? `<p class="upgrade-level">${cardMeta(id)}</p>` :
                       ''}<p class="upgrade-preview">${preview}</p>${
        cost && !button.includes(' · ') ? `<p class="upgrade-cost">需要：${cost}</p>` :
               ''}</div><button type="button" data-action ${enabled ? '' : 'disabled'}>${
        button}</button>`;
    panelEncyclopedia.set('v16-' + id, {
      id: 'v16-' + id,
      name,
      category: 'v0.16',
      summary: intro,
      details: [...details, preview, cost, cardMeta(id)]
    });
    a.querySelector('[data-action]').onclick = click;
    a.querySelector('[data-encyclopedia]').onclick = () => openEncyclopedia('v16-' + id);
    list.append(a)
  }

  function renderMindUpgrades(list) {
    if (['frequency', 'growth', 'network', 'spirit-language'].some(outputAvailable) ||
        s.totalNodes > 0 && s.runThoughts >= 2000)
      upgradeHeading(list, '基础提升 · 资源产出');
    for (const [id, name, intro] of [
             ['frequency', '思绪流动', '加快扰动与念头的生成节奏。'],
             ['growth', '思想萌发', '让每次思绪起伏更加饱满。'],
             ['network', '灵感', '提高主动点击的念头数量。'],
             ['spirit-language', '灵与身', '提高载体自动与主动资源效率。']]) {
      if (id === 'spirit-language' && !s.spiritLanguageUnlocked) {
        if (s.totalNodes > 0 && s.runThoughts >= 2000)
          uiCard(
              list, 'spirit-unlock', '灵与身 · 前置', '连接思维和载体。', '联动能力：未开放 → 可升级',
              '解锁 · 300 念头', s.thoughts >= 300, () => {
                s.thoughts -= 300;
                s.spiritLanguageUnlocked = true;
                render();
                save()
              });
        continue
      }
      if (!outputAvailable(id)) continue;
      const l = upgradeLevel(id);
      uiCard(
          list, id, name, intro,
          id === 'frequency' ?
              `间隔 ${Math.round(thoughtInterval() * 1000)} → ${
                  Math.round(
                      3 * .9 * Math.pow(.975, s.rateLv) /
                      ((1 +
                        s.mind * .0001 * (1 + s.networkLinks * (s.mindEvolutions.thread ? .001 : .0001))) *
                       (1 + (s.networkCount || 0) * .0001)) *
                      1000)} 毫秒` :
              id === 'growth' ?
              `单次 ${growthYield()} → ${growthYield() + 5}` :
              id === 'network' ?
              `点击 ${clickThoughtYield()} → ${clickThoughtYield() + 5}` :
              `载体效率 +${l * .5}% → +${(l + 1) * .5}%；单次额外 +${l * 5} → +${(l + 1) * 5}`,
          `升级 · ${upgradeCost(id)} 念头`, s.thoughts >= upgradeCost(id) && l < upgradeCap(id),
          () => buyUpgrade(id), [
            `等级 ${l}/${upgradeCap(id)}`,
            id === 'frequency' ?
                '首次缩短 10%，之后逐级乘以 0.975；独立于单次产量。' :
                id === 'spirit-language' ?
                '每级载体资源效率 +0.5%，单次获取基础量 +5；自动与点击均生效，内部保留小数余额。' :
                '产出与存储容量相互独立。'
          ])
    }
    if (s.mindEvolutions.sprout || s.storage.mind > 0 ||
        ['node', 'link', 'network'].some(k => (s.capacityLevels[k] || 0) > 0) || s.mind >= 9)
      upgradeHeading(list, '基础提升 · 容量存储');
    if (revealUpgrade('storage', !!s.mindEvolutions.sprout || s.storage.mind > 0))
      uiCard(
          list, 'storage', '思念拓展', '扩展念头承载空间。',
          `${thoughtCapacity()} → ${thoughtCapacity() + 5000}`, `扩容 · ${storageCost('mind')} 念头`,
          !storageRequirement('mind') && s.thoughts >= storageCost('mind'), () => buyStorage('mind'),
          [storageRequirement('mind') || '本轮有效，上限 20 级']);
    for (const [kind, name, ready] of [
             ['node', '思绪凝聚', s.mind >= 9],
             ['link', '思脉贯通', s.mindEvolutions.knowledge && s.networkLinks >= 3],
             ['network', '思网联结', s.mindEvolutions.web && s.networkCount >= 2]]) {
      if (!revealUpgrade('cap-' + kind, ready || (s.capacityLevels[kind] || 0) > 0)) continue;
      const l = s.capacityLevels[kind] || 0,
            cap = kind === 'node' ? nodeCapacity() :
          kind === 'link'         ? linkCapacity() :
                                    networkCapacity(),
            cost = Math.ceil(
                ({
                  node: 500 + (100 + 200 * l) * (1 + l / 100),
                  link: 1000 + (100 + 300 * l) * (1 + l / 100),
                  network: 2000 + (100 + 500 * l) * (1 + l / 100)
                }[kind]) *
                thoughtDiscount()),
            nodes = kind === 'node' ? 0 : 5 + l, links = kind === 'network' ? l : 0;
      uiCard(
          list, 'cap-' + kind, name, '扩大当前资源的存储上限。',
          `${cap} → ${cap + (kind === 'network' ? 1 : 5)}`,
          `扩容 · ${cost} 念头、${nodes} 节点、${links} 链接`,
          ready && l < ({node: 20, link: 15, network: 10}[kind]) && s.thoughts >= cost && s.mind >= nodes &&
              s.networkLinks >= links,
          () => buyCapacity(kind), [`当前等级 ${l}；费用公式遵循 v0.16 文档；材料不足不会扣费。`])
    }
    if (s.runThoughts >= 500 || Object.values(s.mindEvolutions).some(Boolean))
      upgradeHeading(list, '进阶拓展 · 转化与能力');
    for (const id of ['sprout', 'knowledge', 'thread', 'web']) {
      const d = mindEvolutionDef(id);
      if (s.mindEvolutions[id] || !revealUpgrade(id, d.ready)) continue;
      uiCard(
          list, id, d.name, '解锁下一段思维转化能力。',
          `消耗 ${d.cost} 念头、${d.nodes} 节点、${d.links} 链接`, '解锁',
          d.ready && s.thoughts >= d.cost && s.mind >= d.nodes && s.networkLinks >= d.links,
          () => unlockMindEvolution(id),
          [id === 'sprout' ? '累计 500 念头；每 30 秒合成节点，基础成本 500，每持有 5 节点成本 +100。' :
               id === 'knowledge' ? '累计 10 节点；节点容量扩展至 20。' :
               id === 'thread'    ? '拥有 10 节点且累计 2 链接；提高链接对节点的增幅。' :
                                    '拥有 10 链接且节点串联已解锁；开放网络合成。'])
    }
    for (const [id, name, ready] of [
             [
               'link', '合成思绪链接',
               s.mindEvolutions.knowledge && s.mind >= 3 && s.networkLinks < linkCapacity()
             ],
             [
               'network', '合成思维网络',
               s.mindEvolutions.web && s.networkLinks >= 3 && s.networkCount < networkCapacity()
             ],
             ['ideology', '凝结思想', s.stageUnlocks.ideology && s.networkCount >= 100]])
      if (revealUpgrade(
              'convert-' + id,
              id === 'link'        ? !!s.mindEvolutions.knowledge :
                  id === 'network' ? !!s.mindEvolutions.web :
                                     !!s.stageUnlocks.ideology))
        uiCard(
            list, 'convert-' + id, name, '消耗下级资源转化。',
            id === 'link' ? `3 节点 + ${1000 * Math.floor(s.networkLinks / 3)} 念头 → 1 链接` :
                id === 'network' ? '3 链接 → 1 网络' :
                                   '100 网络 → 1 思想',
            '转化', ready, () => convertMind(id));
    renderSpecialSection(
        list, item => item.type === 'cap' && !speciesUpgradeDefs().some(x => x.id === item.id));
  }

  function renderPendingTraits(list) {
    for (const p of pendingTraits())
      uiCard(
          list, 'trait-' + p.def.id + '-' + p.threshold, p.def.name + ' · ' + p.threshold + ' 阶段',
          '基础数值与特性加成分别记录。',
          `总值 ${s.raceStats[p.def.id] || 0} → ${
              (s.raceStats[p.def.id] || 0) + 3 * (traitThresholds.indexOf(p.threshold) + 1)}；特性加成 +${
              3 * (traitThresholds.indexOf(p.threshold) + 1)}`,
          `选择 · ${100 * p.threshold} ${raceResourceName(currentRaceCurrency())}`,
          (s.raceResources[currentRaceCurrency()] || 0) >= 100 * p.threshold,
          () => chooseTrait(p.def.id, p.threshold),
          ['判定强化的单位和具体判定仍待定义；联动被动留白，本轮不提供无效购买。'])
  }

  for (const id of ['thoughtSpeed', 'trialTime', 'planSlots']) s.legacyBoosts[id] = s.legacyBoosts[id] || 0;
  const previousStages = stageChoices;
  stageChoices = () => {
    const old = previousStages().filter(
        x => x.owned &&
            !['archive', 'resourceFlow', 'structure', 'mindStorage', 'raceStorage', 'trialTime', 'planSlots', 'branch', 'worldChoice']
                 .includes(x.id));
    const cleared = s.cycleHistory.filter(x => x.cleared).length;
    const defs = [
      ['archive', '初始意识', s.archiveLv, 10, 1, '每级下一轮初始念头 +50、扰动 +100。', false],
      [
        'mindStorage', '思维仓库', s.legacyStorage.mind, Infinity, 1 + 2 * s.legacyStorage.mind,
        '永久念头容量 +5000 / 级。', false
      ],
      [
        'raceStorage', '载体仓库', s.legacyStorage.race, Infinity, 1 + 2 * s.legacyStorage.race,
        '永久载体容量 +5000 / 级。', false
      ],
      [
        'resourceFlow', '资源涌流', s.legacyBoosts.resourceFlow, 20, 2 + s.legacyBoosts.resourceFlow,
        '思维与载体基础产出各 +5 / 秒。', false
      ],
      [
        'thoughtSpeed', '思维迅捷', s.legacyBoosts.thoughtSpeed, 15, 1 + 3 * s.legacyBoosts.thoughtSpeed,
        '思维升级成本 −5% / 级。', s.legacyStorage.mind <= 5
      ],
      [
        'structure', '结构稳固', s.legacyBoosts.structure, 15, 1 + 3 * s.legacyBoosts.structure,
        '载体升级成本 −5% / 级。', s.legacyStorage.race <= 5
      ],
      [
        'trialTime', '高瞻远瞩', s.legacyBoosts.trialTime, 15, 1 + 2 * s.legacyBoosts.trialTime,
        '准备时间 +2 分钟 / 级。', s.cycleHistory.length < 3
      ],
      [
        'planSlots', '锦囊妙计', s.legacyBoosts.planSlots, 5, 5 + 5 * s.legacyBoosts.planSlots,
        '方案数量与级别上限 +1 / 级，最高 10。', s.legacyBoosts.trialTime <= 3
      ]
    ];
    return [
      ...old,
      {id:'worldChoice', name:'世界抉择', cost:3, desc:'后续轮回可主动选择世界观。', owned:!!s.stageUnlocks.worldChoice, locked:!(s.tribeDeveloped || (s.society?.population || 0) >= 2 || (s.tribe || 0) >= 2)},
      {id:'branch', name:'专项抉择', cost:3, desc:'后续轮回开放世界观分支。', owned:!!s.stageUnlocks.branch, locked:!s.stageUnlocks.worldChoice},
      ...defs.map(
          ([id, name, level, max, cost, desc, locked]) =>
              ({id, name, level, max, cost, desc, locked, boost: true, owned: level >= max})),
      {
        id: 'newBeginning',
        name: '崭新的开始',
        cost: 20,
        desc: '跳过扰动开场，直接进入念头成长。',
        owned: !!s.stageUnlocks.newBeginning,
        locked: !cleared || s.archiveLv < 10
      },
      {
        id: 'infoArchive',
        name: '信息留存',
        cost: 5,
        desc: '开放跨轮回灾难资料库。',
        owned: !!s.stageUnlocks.infoArchive,
        locked: !cleared
      }
    ]
  };
  const priorRaceCost = raceUpgradeCost;
  raceUpgradeCost = id => {
    const d = speciesUpgradeDefs().find(x => x.id === id), l = upgradeLevel(id);
    const base = d?.kind === 'stat' ? 200 + 100 * l * (1 + s.raceStage) * (1 + l / 100) : priorRaceCost(id);
    return Math.max(1, Math.ceil(base * (1 - .05 * s.legacyBoosts.structure)))
  };
  crisisPrepCost = id => {
    const l = Math.max(0, ...s.trialPlan.plans.map(p => p.quality));
    return id === 'study' ? 500 + 200 * l : id === 'protect' ? 500 + 100 * l : 500 + 300 * l
  };



  const oldWake16 = wake;
  wake = () => {
    oldWake16();
    s.disturbances = Math.min(1000, Math.max(s.disturbances, 100 * s.archiveLv));
    render();
    save()
  };

  const previousPreview16 = upgradePreview;
  upgradePreview = id => {
    const d = speciesUpgradeDefs().find(x => x.id === id);
    if (d?.kind === 'stat')
      return `基础 ${s.raceBase[id] || 0} + 特性 ${s.raceTraitBonus[id] || 0}；总值 ${
          s.raceStats[id] || 0} → ${(s.raceStats[id] || 0) + 1}`;
    return previousPreview16(id)
  };
  // UI_EVENTS_BEGIN
  $('worldDataSelect').addEventListener('change', e => {
    s.worldDataView = e.target.value;
    updateWorldDataView();
    $('worldDataContent').scrollTop = 0;
    save()
  });
  $('acceptOffline').addEventListener('click', () => $('offlineReport').hidden = true);
  $('emptyPrompt').addEventListener('click', wake);
  action.addEventListener('click', pressMain);
  world.addEventListener('click', e => {
    if (e.target.closest('#mainAction,#emptyPrompt,#upgradePanel,#worldviewData,#choices,.topline,.cycle-notice')) return;
    if (['empty-button', 'glyph'].includes(s.mode)) {
      disturb(false, e);
      return
    }
    if (['growth', 'species', 'world'].includes(s.mode)) {
      activeThought(e)
    }
  });
  $('reset').addEventListener('click', () => {
    if (confirm('清除本机保存的 FZZL 试玩进度？')) {
      localStorage.removeItem(KEY);
      s = fresh();
      render()
    }
  });
  $('openEncyclopedia').addEventListener('click', () => openEncyclopedia());
  $('encyclopediaSearch').addEventListener('input', () => renderEncyclopedia());
  document.querySelectorAll('[data-close-encyclopedia]')
      .forEach(b => b.addEventListener('click', closeEncyclopedia));
  window.addEventListener('keydown', e => {
    if (!$('offlineReport').hidden) {
      if (e.key === 'Escape') $('offlineReport').hidden = true;
      return
    }
    if (!$('encyclopedia').hidden) {
      if (e.key === 'Escape') closeEncyclopedia();
      return
    }
    if (e.target?.matches?.('input, textarea, select, button, [contenteditable]')) return;
    if (e.code === 'Space') {
      if (s.mode === 'void') {
        e.preventDefault();
        wake()
      } else if (['empty-button', 'glyph'].includes(s.mode)) {
        e.preventDefault();
        disturb(false)
      } else if (['growth', 'species', 'world'].includes(s.mode)) {
        e.preventDefault();
        activeThought()
      }
    }
  });
  let flowClock = 0, last = performance.now(), disturbanceAccumulator = 0, thoughtAccumulator = 0,
      raceAccumulator = 0;
  // 在线循环。累计帧间隔，分别推进资源、合成与考验。
  function tick(now) {
    if (!document.hidden && trialExpired()) {
      resolveTimedTrial();
      requestAnimationFrame(tick);
      return
    }
    if (document.hidden) {
      last = now;
      requestAnimationFrame(tick);
      return
    }
    const dt = Math.min((now - last) / 1000, .5);
    last = now;
    if (['growth', 'species', 'world'].includes(s.mode)) {
      flowClock += dt;
      while (flowClock >= 1) {
        flowClock--;
        addThought(5 * (s.legacyBoosts.resourceFlow || 0))
      }
    }
    if (['growth', 'species', 'world'].includes(s.mode) && s.species && s.worldview) {
      raceAccumulator += dt;
      let raceChanged = false;
      while (raceAccumulator >= 1) {
        raceAccumulator -= 1;
        for (const [rid] of worlds[s.worldview].resources)
          if (rid === worlds[s.worldview].currency) {
            const remainder = (s.raceResourceRemainder[rid] || 0) + carrierRateThousandths(),
                  wholeGain = Math.floor(remainder / 1000);
            s.raceResourceRemainder[rid] = remainder % 1000;
            if (wholeGain) {
              s.raceResources[rid] = Math.min(raceCapacity(rid), (s.raceResources[rid] || 0) + wholeGain);
              raceChanged = true
            }
          }
      }
      if (raceChanged) {
        renderGoalHud();
        renderResources();
        renderUpgrades();
        save()
      }
    }
    if (['growth', 'species', 'world'].includes(s.mode)) {
      disturbanceAccumulator += dt;
      while (disturbanceAccumulator >= disturbanceInterval()) {
        disturbanceAccumulator -= disturbanceInterval();
        addDisturbance(growthYield());
        const before = s.runThoughts;
        convertDisturbances();
        if (s.runThoughts > before) {
          s.newCycleWelcome = false;
          gainThought(0, before)
        } else {
          renderResources();
          save()
        }
      }
    }
    if (['growth', 'species', 'world'].includes(s.mode) && s.mindEvolutions.sprout) {
      s.mindClock += dt;
      while (s.mindClock >= 30) {
        s.mindClock -= 30;
        if (synthesizeNode()) {
          render();
          save()
        }
      }
    }
    if (['growth', 'species', 'world'].includes(s.mode)) {
      thoughtAccumulator += dt;
      while (thoughtAccumulator >= thoughtInterval()) {
        thoughtAccumulator -= thoughtInterval();
        gainThought(thoughtYield())
      }
    }
    requestAnimationFrame(tick)
  }
  const nowAtLoad = Date.now(), dueAtLoad = trialExpired(nowAtLoad),
        initialReport = settleOffline(dueAtLoad ? s.trialPlan.deadline : nowAtLoad);
  if (dueAtLoad) resolveTimedTrial();
  if (['growth', 'species', 'world', 'trial', 'aftermath', 'summary'].includes(s.mode)) updateMindChain();
  render();
  showOfflineReport(initialReport);
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      save()
    } else {
      const now = Date.now(), due = trialExpired(now),
            report = settleOffline(due ? s.trialPlan.deadline : now);
      if (due) resolveTimedTrial();
      last = performance.now();
      render();
      showOfflineReport(report)
    }
  });
  window.addEventListener('pagehide', () => {
    if (!document.hidden) save()
  });
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
